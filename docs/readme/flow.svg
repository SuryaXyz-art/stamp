<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="How a stamp moves: the sender pays into the StampBox contract, the message reaches the receiver, then the stamp is refunded on reply, kept on spam, or reclaimed by the sender after 7 days">
  <title>How a stamp moves</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#110622"/><stop offset=".6" stop-color="#0A0714"/><stop offset="1" stop-color="#04141B"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2BD6"/><stop offset=".55" stop-color="#8B5CFF"/><stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
    <path id="p1" d="M 262 200 L 530 200"/>
    <path id="p2" d="M 750 200 L 1018 200"/>
    <path id="p3" d="M 610 130 C 540 60, 280 60, 190 122"/>
    <path id="p4" d="M 700 270 C 820 330, 1000 330, 1100 278"/>
    <path id="p5" d="M 580 270 C 470 330, 290 330, 180 278"/>
    <symbol id="env" viewBox="-14 -10 28 20">
      <rect x="-13" y="-9" width="26" height="18" rx="2.5" fill="#0A0714" stroke="#00F0FF" stroke-width="2"/>
      <path d="M -12 -7 L 0 2 L 12 -7" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <style>
      text { font-family: "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .march { stroke-dasharray: 5 9; animation: march 1.8s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -28 } }
      .breathe { animation: breathe 3s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: .9 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <rect width="1280" height="400" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="398" rx="21" fill="none" stroke="url(#neon)" stroke-opacity=".45" stroke-width="2"/>

  <!-- tracks -->
  <g fill="none" stroke-width="2.5">
    <use href="#p1" stroke="#B26BFF" stroke-opacity=".7" class="march"/>
    <use href="#p2" stroke="#00F0FF" stroke-opacity=".7" class="march"/>
    <use href="#p3" stroke="#C6FF3D" stroke-opacity=".6" class="march"/>
    <use href="#p4" stroke="#FF2BD6" stroke-opacity=".6" class="march"/>
    <use href="#p5" stroke="#00F0FF" stroke-opacity=".45" class="march"/>
  </g>

  <!-- track labels -->
  <g class="mono" font-size="13" letter-spacing="1.5" text-anchor="middle">
    <text x="396" y="186" fill="#C9B8FF">send(to, message)</text>
    <text x="396" y="226" fill="#7E78A3">+ $1 USDC</text>
    <text x="884" y="186" fill="#9FF7FF">message delivered</text>
    <text x="884" y="226" fill="#7E78A3">&lt; 1 second</text>
  </g>

  <!-- outcome labels (each lights up in its turn) -->
  <g font-weight="800" font-size="16" letter-spacing="1.5" text-anchor="middle">
    <g opacity=".35">
      <rect x="290" y="22" width="232" height="34" rx="17" fill="#C6FF3D" fill-opacity=".1" stroke="#C6FF3D"/>
      <text x="406" y="45" fill="#C6FF3D">REPLY → REFUNDED</text>
      <animate attributeName="opacity" values=".35;.35;1;1;.35;.35" keyTimes="0;.18;.2;.31;.333;1" dur="15s" repeatCount="indefinite"/>
    </g>
    <g opacity=".35">
      <rect x="772" y="344" width="232" height="34" rx="17" fill="#FF2BD6" fill-opacity=".1" stroke="#FF2BD6"/>
      <text x="888" y="367" fill="#FF2BD6">SPAM → YOU KEEP IT</text>
      <animate attributeName="opacity" values=".35;.35;1;1;.35;.35" keyTimes="0;.18;.2;.31;.333;1" dur="15s" begin="-10s" repeatCount="indefinite"/>
    </g>
    <g opacity=".35">
      <rect x="250" y="344" width="290" height="34" rx="17" fill="#00F0FF" fill-opacity=".1" stroke="#00F0FF"/>
      <text x="395" y="367" fill="#00F0FF">IGNORED 7 DAYS → RECLAIM</text>
      <animate attributeName="opacity" values=".35;.35;1;1;.35;.35" keyTimes="0;.18;.2;.31;.333;1" dur="15s" begin="-5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- sender -->
  <g transform="translate(170 200)">
    <rect x="-92" y="-72" width="184" height="144" rx="18" fill="#0E0C16" stroke="#B26BFF" stroke-opacity=".8" stroke-width="2"/>
    <circle cx="0" cy="-26" r="14" fill="none" stroke="#B26BFF" stroke-width="3"/>
    <path d="M -24 6 C -22 -10, 22 -10, 24 6" fill="none" stroke="#B26BFF" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#F4F1FF" letter-spacing="2">SENDER</text>
    <text x="0" y="58" text-anchor="middle" font-size="13" fill="#9A94BF">wants your attention</text>
  </g>

  <!-- contract -->
  <g transform="translate(640 200)">
    <rect x="-104" y="-80" width="208" height="160" rx="16" fill="#8B5CFF" opacity=".25" filter="url(#blur)" class="breathe"/>
    <rect x="-104" y="-80" width="208" height="160" rx="16" fill="#0E0C16" stroke="url(#neon)" stroke-width="3" stroke-dasharray="10 6"/>
    <path d="M -14 -36 v -8 a 14 14 0 0 1 28 0 v 8" fill="none" stroke="#F4F1FF" stroke-width="3"/>
    <rect x="-20" y="-38" width="40" height="28" rx="5" fill="url(#neon)"/>
    <text x="0" y="22" text-anchor="middle" font-size="22" font-weight="900" fill="#F4F1FF" letter-spacing="1.5">StampBox</text>
    <text x="0" y="44" text-anchor="middle" font-size="13" fill="#9A94BF">escrow on Arc mainnet</text>
    <text x="0" y="64" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#7E78A3" class="mono">NO OWNER · NO ADMIN</text>
  </g>

  <!-- receiver -->
  <g transform="translate(1110 200)">
    <rect x="-92" y="-72" width="184" height="144" rx="18" fill="#0E0C16" stroke="#00F0FF" stroke-opacity=".8" stroke-width="2"/>
    <path d="M -26 -40 h 52 v 30 h -14 l -6 8 h -12 l -6 -8 h -14 z" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linejoin="round"/>
    <text x="0" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#F4F1FF" letter-spacing="2">YOU</text>
    <text x="0" y="58" text-anchor="middle" font-size="13" fill="#9A94BF">inbox priced at $1</text>
  </g>

  <!-- three rounds, one per outcome: 0s refund · 5s keep · 10s reclaim -->
  <g id="round">
    <!-- stamp coin: sender → contract -->
    <g opacity="0">
      <circle r="15" fill="#B26BFF" opacity=".5" filter="url(#blur)"/>
      <circle r="12" fill="#0A0714" stroke="#B26BFF" stroke-width="2.5"/>
      <text y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#E3D4FF" class="mono">$1</text>
      <animateMotion dur="15s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.09;1" calcMode="linear"><mpath href="#p1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.005;.09;.1;1" dur="15s" repeatCount="indefinite"/>
    </g>
    <!-- envelope: contract → receiver -->
    <g opacity="0">
      <circle r="15" fill="#00F0FF" opacity=".4" filter="url(#blur)"/>
      <use href="#env" x="-14" y="-10" width="28" height="20"/>
      <animateMotion dur="15s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.1;.19;1" calcMode="linear"><mpath href="#p2"/></animateMotion>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.1;.105;.19;.2;1" dur="15s" repeatCount="indefinite"/>
    </g>
    <!-- refund: contract → sender -->
    <g opacity="0">
      <circle r="15" fill="#C6FF3D" opacity=".5" filter="url(#blur)"/>
      <circle r="12" fill="#0A0714" stroke="#C6FF3D" stroke-width="2.5"/>
      <text y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#C6FF3D" class="mono">$1</text>
      <animateMotion dur="15s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.2;.31;1" calcMode="linear"><mpath href="#p3"/></animateMotion>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.205;.31;.32;1" dur="15s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <g opacity="0">
      <circle r="15" fill="#B26BFF" opacity=".5" filter="url(#blur)"/>
      <circle r="12" fill="#0A0714" stroke="#B26BFF" stroke-width="2.5"/>
      <text y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#E3D4FF" class="mono">$1</text>
      <animateMotion dur="15s" begin="-10s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.09;1" calcMode="linear"><mpath href="#p1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.005;.09;.1;1" dur="15s" begin="-10s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <circle r="15" fill="#00F0FF" opacity=".4" filter="url(#blur)"/>
      <use href="#env" x="-14" y="-10" width="28" height="20"/>
      <animateMotion dur="15s" begin="-10s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.1;.19;1" calcMode="linear"><mpath href="#p2"/></animateMotion>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.1;.105;.19;.2;1" dur="15s" begin="-10s" repeatCount="indefinite"/>
    </g>
    <!-- keep: contract → receiver -->
    <g opacity="0">
      <circle r="15" fill="#FF2BD6" opacity=".5" filter="url(#blur)"/>
      <circle r="12" fill="#0A0714" stroke="#FF2BD6" stroke-width="2.5"/>
      <text y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#FF8BEA" class="mono">$1</text>
      <animateMotion dur="15s" begin="-10s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.2;.31;1" calcMode="linear"><mpath href="#p4"/></animateMotion>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.205;.31;.32;1" dur="15s" begin="-10s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <g opacity="0">
      <circle r="15" fill="#B26BFF" opacity=".5" filter="url(#blur)"/>
      <circle r="12" fill="#0A0714" stroke="#B26BFF" stroke-width="2.5"/>
      <text y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#E3D4FF" class="mono">$1</text>
      <animateMotion dur="15s" begin="-5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.09;1" calcMode="linear"><mpath href="#p1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.005;.09;.1;1" dur="15s" begin="-5s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <circle r="15" fill="#00F0FF" opacity=".4" filter="url(#blur)"/>
      <use href="#env" x="-14" y="-10" width="28" height="20"/>
      <animateMotion dur="15s" begin="-5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.1;.19;1" calcMode="linear"><mpath href="#p2"/></animateMotion>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.1;.105;.19;.2;1" dur="15s" begin="-5s" repeatCount="indefinite"/>
    </g>
    <!-- reclaim: contract → sender, after 7 days -->
    <g opacity="0">
      <circle r="15" fill="#00F0FF" opacity=".5" filter="url(#blur)"/>
      <circle r="12" fill="#0A0714" stroke="#00F0FF" stroke-width="2.5"/>
      <text y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#9FF7FF" class="mono">$1</text>
      <animateMotion dur="15s" begin="-5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.2;.31;1" calcMode="linear"><mpath href="#p5"/></animateMotion>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.205;.31;.32;1" dur="15s" begin="-5s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
