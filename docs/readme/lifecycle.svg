<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580" role="img" aria-label="Lifecycle of a stamp: send() creates a Pending stamp holding the USDC. From Pending it ends in exactly one of three states: Refunded when the receiver replies, Kept when the receiver marks it spam, or Reclaimed by the sender after 7 days of no action.">
  <title>Lifecycle of a stamp</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#110622"/><stop offset=".6" stop-color="#0A0714"/><stop offset="1" stop-color="#04141B"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2BD6"/><stop offset=".55" stop-color="#8B5CFF"/><stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1233"/><stop offset="1" stop-color="#0B1520"/>
    </linearGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B26BFF"/></marker>
    <marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00F0FF"/></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FF2BD6"/></marker>
    <marker id="aL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C6FF3D"/></marker>
    <style>
      text { font-family: "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .s { font-size: 13.5px; fill: #9A94BF; }
      .march { stroke-dasharray: 6 8; animation: march 1.6s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -28 } }
      .breathe { animation: breathe 3s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: .95 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <rect width="1280" height="580" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="578" rx="21" fill="none" stroke="url(#neon)" stroke-opacity=".45" stroke-width="2"/>

  <!-- header -->
  <text x="40" y="50" class="mono" font-size="13" letter-spacing="3" fill="#00F0FF">LIFECYCLE OF A STAMP</text>
  <text x="40" y="84" font-size="28" font-weight="800" fill="#F4F1FF">One stamp, one ending. Settled forever.</text>

  <!-- start -->
  <circle cx="64" cy="310" r="14" fill="#B26BFF"/>
  <circle cx="64" cy="310" r="22" fill="none" stroke="#B26BFF" stroke-opacity=".4" stroke-width="2"/>
  <path d="M 88 310 L 176 310" fill="none" stroke="#B26BFF" stroke-width="2.5" class="march" marker-end="url(#aP)"/>
  <text x="132" y="296" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#C9B8FF">send()</text>

  <!-- pending -->
  <rect x="184" y="210" width="290" height="200" rx="18" fill="#8B5CFF" opacity=".35" filter="url(#blur)" class="breathe"/>
  <rect x="184" y="210" width="290" height="200" rx="18" fill="url(#box)" stroke="url(#neon)" stroke-width="2.5"/>
  <text x="329" y="256" text-anchor="middle" font-size="26" font-weight="800" fill="#F4F1FF" letter-spacing="2">⏳ PENDING</text>
  <text x="329" y="292" text-anchor="middle" class="mono" font-size="13" fill="#9FF7FF">USDC locked in StampBox</text>
  <text x="329" y="322" text-anchor="middle" class="s">amount ≥ receiver's price</text>
  <text x="329" y="344" text-anchor="middle" class="s">message lives in the Sent event</text>
  <rect x="249" y="364" width="160" height="26" rx="13" fill="#B26BFF" fill-opacity=".14" stroke="#B26BFF"/>
  <text x="329" y="381.5" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" letter-spacing="1" fill="#C9B8FF">7-DAY CLOCK STARTS</text>

  <!-- branches -->
  <g fill="none" stroke-width="2.5">
    <path d="M 476 270 C 640 270, 650 150, 808 150" stroke="#C6FF3D" class="march" marker-end="url(#aL)"/>
    <path d="M 476 310 L 808 310" stroke="#FF2BD6" class="march" marker-end="url(#aM)"/>
    <path d="M 476 350 C 640 350, 650 470, 808 470" stroke="#00F0FF" class="march" marker-end="url(#aC)"/>
  </g>

  <!-- branch labels -->
  <g class="mono" font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="530" y="132" width="230" height="30" rx="15" fill="#0A0714" stroke="#C6FF3D"/>
    <text x="645" y="152" fill="#C6FF3D">refund(id, reply) · receiver</text>
    <rect x="555" y="280" width="180" height="30" rx="15" fill="#0A0714" stroke="#FF2BD6"/>
    <text x="645" y="300" fill="#FF2BD6">keep(id) · receiver</text>
    <rect x="510" y="460" width="270" height="30" rx="15" fill="#0A0714" stroke="#00F0FF"/>
    <text x="645" y="480" fill="#00F0FF">reclaim(id) · sender · ⏱ 7 days</text>
  </g>

  <!-- outcomes -->
  <g>
    <rect x="816" y="96" width="340" height="108" rx="16" fill="#C6FF3D" fill-opacity=".07" stroke="#C6FF3D" stroke-width="2"/>
    <text x="840" y="132" font-size="21" font-weight="800" fill="#C6FF3D" letter-spacing="1.5">✅ REFUNDED</text>
    <text x="840" y="160" class="mono" font-size="13.5" fill="#F4F1FF">💸 USDC → back to sender</text>
    <text x="840" y="184" class="s">you replied, the reply is posted on-chain</text>

    <rect x="816" y="256" width="340" height="108" rx="16" fill="#FF2BD6" fill-opacity=".07" stroke="#FF2BD6" stroke-width="2"/>
    <text x="840" y="292" font-size="21" font-weight="800" fill="#FF2BD6" letter-spacing="1.5">🗑️ KEPT</text>
    <text x="840" y="320" class="mono" font-size="13.5" fill="#F4F1FF">💸 USDC → you, the receiver</text>
    <text x="840" y="344" class="s">it was spam, so they paid for your time</text>

    <rect x="816" y="416" width="340" height="108" rx="16" fill="#00F0FF" fill-opacity=".07" stroke="#00F0FF" stroke-width="2"/>
    <text x="840" y="452" font-size="21" font-weight="800" fill="#00F0FF" letter-spacing="1.5">↩️ RECLAIMED</text>
    <text x="840" y="480" class="mono" font-size="13.5" fill="#F4F1FF">💸 USDC → back to sender</text>
    <text x="840" y="504" class="s">ignored for 7 days, the sender takes it back</text>
  </g>

  <!-- ends -->
  <g fill="none" stroke-width="2">
    <path d="M 1158 150 L 1200 150" stroke="#C6FF3D" marker-end="url(#aL)"/>
    <path d="M 1158 310 L 1200 310" stroke="#FF2BD6" marker-end="url(#aM)"/>
    <path d="M 1158 470 L 1200 470" stroke="#00F0FF" marker-end="url(#aC)"/>
  </g>
  <g>
    <circle cx="1222" cy="150" r="13" fill="none" stroke="#C6FF3D" stroke-width="2.5"/><circle cx="1222" cy="150" r="7" fill="#C6FF3D"/>
    <circle cx="1222" cy="310" r="13" fill="none" stroke="#FF2BD6" stroke-width="2.5"/><circle cx="1222" cy="310" r="7" fill="#FF2BD6"/>
    <circle cx="1222" cy="470" r="13" fill="none" stroke="#00F0FF" stroke-width="2.5"/><circle cx="1222" cy="470" r="7" fill="#00F0FF"/>
  </g>

  <!-- footer -->
  <text x="640" y="560" text-anchor="middle" font-size="13.5" fill="#B9B3D6">🛟 If a refund can't be delivered, it's parked in <tspan class="mono" fill="#9FF7FF">owed[]</tspan> (PaymentDeferred) and claimable anytime with <tspan class="mono" fill="#9FF7FF">withdraw()</tspan>.</text>
</svg>
