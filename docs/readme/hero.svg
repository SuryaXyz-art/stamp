<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Stamp: a refundable paid inbox on Arc">
  <title>Stamp: a refundable paid inbox on Arc</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14062A"/>
      <stop offset=".55" stop-color="#0A0714"/>
      <stop offset="1" stop-color="#03131A"/>
    </linearGradient>
    <radialGradient id="glowM" cx=".18" cy=".2" r=".6">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".85" cy=".9" r=".6">
      <stop offset="0" stop-color="#00F0FF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2BD6"/>
      <stop offset=".55" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset=".35" stop-color="#FF2BD6"/>
      <stop offset=".7" stop-color="#B26BFF"/>
      <stop offset="1" stop-color="#00F0FF"/>
      <animate attributeName="x1" values="0;-.6;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;.4;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <mask id="perf">
      <rect x="-80" y="-100" width="160" height="200" fill="#fff"/>
      <g fill="#000">
        <circle cx="-64" cy="-100" r="7"/><circle cx="-32" cy="-100" r="7"/><circle cx="0" cy="-100" r="7"/><circle cx="32" cy="-100" r="7"/><circle cx="64" cy="-100" r="7"/>
        <circle cx="-64" cy="100" r="7"/><circle cx="-32" cy="100" r="7"/><circle cx="0" cy="100" r="7"/><circle cx="32" cy="100" r="7"/><circle cx="64" cy="100" r="7"/>
        <circle cx="-80" cy="-75" r="7"/><circle cx="-80" cy="-45" r="7"/><circle cx="-80" cy="-15" r="7"/><circle cx="-80" cy="15" r="7"/><circle cx="-80" cy="45" r="7"/><circle cx="-80" cy="75" r="7"/>
        <circle cx="80" cy="-75" r="7"/><circle cx="80" cy="-45" r="7"/><circle cx="80" cy="-15" r="7"/><circle cx="80" cy="15" r="7"/><circle cx="80" cy="45" r="7"/><circle cx="80" cy="75" r="7"/>
      </g>
    </mask>
    <path id="route1" d="M -40 360 C 220 300, 360 420, 600 330 S 1000 180, 1320 250"/>
    <path id="route2" d="M -40 120 C 260 60, 520 200, 760 120 S 1100 40, 1320 90"/>
    <path id="ring" d="M 1105 120 m -78 0 a 78 78 0 1 1 156 0 a 78 78 0 1 1 -156 0"/>
    <symbol id="env" viewBox="-14 -10 28 20">
      <rect x="-13" y="-9" width="26" height="18" rx="2.5" fill="#0A0714" stroke="currentColor" stroke-width="2"/>
      <path d="M -12 -7 L 0 2 L 12 -7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <style>
      .tw { animation: tw 3.2s ease-in-out infinite; }
      .tw2 { animation: tw 4.4s ease-in-out infinite 1.1s; }
      .tw3 { animation: tw 2.6s ease-in-out infinite .5s; }
      @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
      .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes float { 0%,100% { transform: translateY(0) rotate(-6deg) } 50% { transform: translateY(-12px) rotate(-3deg) } }
      .spin { animation: spin 26s linear infinite; transform-origin: 1105px 120px; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .march { stroke-dasharray: 6 10; animation: march 2.2s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -32 } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.08); opacity: 1 } }
      .slam { animation: slam 6s cubic-bezier(.2,.9,.3,1.4) infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes slam { 0%,30% { transform: scale(2.4) rotate(-30deg); opacity: 0 } 40% { transform: scale(1) rotate(-14deg); opacity: 1 } 85% { opacity: 1; transform: scale(1) rotate(-14deg) } 100% { opacity: 0; transform: scale(1) rotate(-14deg) } }
      .rise { animation: rise 1.2s ease-out both; }
      .rise2 { animation: rise 1.2s ease-out .25s both; }
      .rise3 { animation: rise 1.2s ease-out .5s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .caret { animation: caret 1s steps(1) infinite; }
      @keyframes caret { 50% { opacity: 0 } }
      text { font-family: "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <rect width="1280" height="440" rx="22" fill="url(#sky)"/>
  <rect width="1280" height="440" rx="22" fill="url(#glowM)"/>
  <rect width="1280" height="440" rx="22" fill="url(#glowC)"/>

  <!-- stars -->
  <g fill="#fff">
    <g class="tw"><circle cx="90" cy="60" r="1.4"/><circle cx="410" cy="40" r="1"/><circle cx="700" cy="70" r="1.3"/><circle cx="980" cy="30" r="1"/><circle cx="1220" cy="380" r="1.4"/><circle cx="560" cy="410" r="1"/></g>
    <g class="tw2"><circle cx="250" cy="110" r="1"/><circle cx="830" cy="380" r="1.2"/><circle cx="1180" cy="60" r="1"/><circle cx="40" cy="300" r="1.2"/><circle cx="640" cy="20" r="1"/><circle cx="1010" cy="410" r="1"/></g>
    <g class="tw3" fill="#9FF7FF"><circle cx="350" cy="380" r="1.2"/><circle cx="760" cy="200" r="1"/><circle cx="1240" cy="190" r="1.2"/><circle cx="150" cy="200" r="1"/><circle cx="900" cy="130" r="1.1"/></g>
  </g>

  <!-- delivery routes -->
  <use href="#route1" fill="none" stroke="#FF2BD6" stroke-opacity=".45" stroke-width="2" class="march"/>
  <use href="#route2" fill="none" stroke="#00F0FF" stroke-opacity=".35" stroke-width="2" class="march"/>

  <!-- flying envelopes -->
  <g color="#FF2BD6">
    <circle r="16" fill="#FF2BD6" opacity=".35" filter="url(#blur)"><animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#route1"/></animateMotion></circle>
    <use href="#env" x="-14" y="-10" width="28" height="20"><animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#route1"/></animateMotion></use>
  </g>
  <g color="#00F0FF">
    <circle r="16" fill="#00F0FF" opacity=".3" filter="url(#blur)"><animateMotion dur="11s" begin="-4s" repeatCount="indefinite" rotate="auto"><mpath href="#route2"/></animateMotion></circle>
    <use href="#env" x="-14" y="-10" width="28" height="20"><animateMotion dur="11s" begin="-4s" repeatCount="indefinite" rotate="auto"><mpath href="#route2"/></animateMotion></use>
  </g>
  <!-- rising coins -->
  <g font-size="13" font-weight="700" text-anchor="middle" class="mono">
    <g><circle r="11" fill="#0A0714" stroke="#C6FF3D" stroke-width="2"/><text y="4.5" fill="#C6FF3D">$</text>
      <animateTransform attributeName="transform" type="translate" values="520 450; 520 -30" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/></g>
    <g><circle r="9" fill="#0A0714" stroke="#00F0FF" stroke-width="2"/><text y="4" fill="#00F0FF" font-size="11">$</text>
      <animateTransform attributeName="transform" type="translate" values="880 450; 880 -30" dur="9s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="9s" begin="-3s" repeatCount="indefinite"/></g>
    <g><circle r="8" fill="#0A0714" stroke="#FF2BD6" stroke-width="2"/><text y="3.5" fill="#FF2BD6" font-size="10">$</text>
      <animateTransform attributeName="transform" type="translate" values="40 450; 40 -30" dur="8s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="8s" begin="-5s" repeatCount="indefinite"/></g>
  </g>

  <!-- postmark ring -->
  <g class="spin" opacity=".55">
    <circle cx="1105" cy="120" r="96" fill="none" stroke="#00F0FF" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="1105" cy="120" r="62" fill="none" stroke="#00F0FF" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 6"/>
    <text font-size="12" letter-spacing="3.2" fill="#00F0FF" class="mono"><textPath href="#ring">STAMP · ARC MAINNET · REFUNDABLE · POSTAGE ·</textPath></text>
  </g>

  <!-- the stamp -->
  <g transform="translate(1000 270)">
    <g class="float">
      <rect x="-90" y="-110" width="180" height="220" rx="10" fill="#FF2BD6" opacity=".35" filter="url(#blur)"/>
      <g mask="url(#perf)">
        <rect x="-80" y="-100" width="160" height="200" fill="url(#neon)"/>
        <rect x="-64" y="-84" width="128" height="168" rx="4" fill="#0A0714"/>
      </g>
      <text x="0" y="12" text-anchor="middle" font-size="56" font-weight="800" fill="url(#title)" class="pulse">$1</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" letter-spacing="4" fill="#B9B3D6" class="mono">USDC · ARC</text>
      <g class="slam">
        <circle cx="38" cy="66" r="44" fill="none" stroke="#C6FF3D" stroke-width="4"/>
        <circle cx="38" cy="66" r="36" fill="none" stroke="#C6FF3D" stroke-width="1.5"/>
        <text x="38" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#C6FF3D" letter-spacing="1">REFUNDED</text>
      </g>
    </g>
  </g>

  <!-- copy -->
  <g transform="translate(70 0)">
    <g class="rise">
      <rect x="0" y="70" width="318" height="34" rx="8" fill="#00F0FF" fill-opacity=".08" stroke="#00F0FF" stroke-opacity=".55"/>
      <circle cx="18" cy="87" r="5" fill="#00F0FF" class="tw3"/>
      <text x="34" y="92" font-size="14" letter-spacing="3.5" fill="#00F0FF" class="mono">REFUNDABLE PAID INBOX · ARC</text>
    </g>
    <g class="rise2">
      <text x="-4" y="200" font-size="100" font-weight="900" letter-spacing="2" fill="#F4F1FF">STAMP</text>
      <text x="-4" y="200" font-size="100" font-weight="900" letter-spacing="2" fill="url(#title)" opacity=".9" filter="url(#soft)">STAMP</text>
      <text x="-4" y="200" font-size="100" font-weight="900" letter-spacing="2" fill="url(#title)">STAMP</text>
    </g>
    <g class="rise3">
      <text x="0" y="244" font-size="30" font-weight="700" fill="#F4F1FF">Your attention has a price. <tspan fill="#FF2BD6">Set it.</tspan></text>
      <text x="0" y="288" font-size="19" fill="#B9B3D6">Strangers attach a USDC stamp to reach you.</text>
      <text x="0" y="316" font-size="19" fill="#B9B3D6"><tspan fill="#C6FF3D" font-weight="700">Reply</tspan> and they're refunded. <tspan fill="#FF2BD6" font-weight="700">Spam</tspan> pays you. <tspan fill="#00F0FF" font-weight="700">Ignored</tspan>? They reclaim it.</text>
      <text x="0" y="372" font-size="15" letter-spacing="3" fill="#7E78A3" class="mono">LIVE ON ARC MAINNET · NON-CUSTODIAL · NO ADMIN KEYS<tspan class="caret" fill="#00F0FF"> ▍</tspan></text>
    </g>
  </g>

  <rect x="1" y="1" width="1278" height="438" rx="21" fill="none" stroke="url(#neon)" stroke-opacity=".6" stroke-width="2"/>
</svg>
