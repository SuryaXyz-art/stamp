packages:
  - contracts
  - web

# Native addons below have pure-JS fallbacks; skipping their build scripts keeps installs fast and Windows-friendly.
allowBuilds:
  sharp: true
  unrs-resolver: true
  bufferutil: false
  keccak: false
  utf-8-validate: false
  # Only a network version check (WalletConnect, via Privy). Not needed.
  '@reown/appkit': false
  # drizzle-kit's bundler; the platform binary comes from the optional @esbuild/* package without the script.
  esbuild: false

# Patched versions of vulnerable transitive dependencies (pnpm audit). Remove once upstream ranges catch up.
# Not overridable, accepted and tracked in SECURITY.md: braces (no patched release; dev-only via the shadcn CLI)
# and decode-uri-component (the fix is ESM-only and breaks query-string's require(); wallet-SDK URI parsing only).
overrides:
  "ws@>=8.0.0 <8.21.0": "^8.21.0"
  "uuid@<11.1.1": "^11.1.1"
  # drizzle-kit (dev only) still lists @esbuild-kit, whose esbuild 0.18 has GHSA-67mh-4wv8-2f99; drizzle-kit's bin never loads it.
  "@esbuild-kit/core-utils>esbuild": "0.25.12"

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces: no patched release; dev-only (shadcn CLI)
    - GHSA-vcc3-ghjq-m6fr # decode-uri-component: fix is ESM-only, breaks query-string; wallet SDK only
