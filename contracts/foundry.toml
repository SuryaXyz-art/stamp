[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 10_000
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[lint]
# block-timestamp: 7-day timeout, second-level skew is irrelevant.
# require-revert-in-loop: batch actions are all-or-nothing by design.
# uninitialized-local: zero-initialised accumulators are intentional.
exclude_lints = ["block-timestamp", "require-revert-in-loop", "uninitialized-local"]

[fuzz]
runs = 1_000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 10_000

[rpc_endpoints]
arc_mainnet = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"

